		<script type="text/javascript" src="game/individualAi.js?v=0016"></script>
		<script type="text/javascript" src="game/teamAi.js?v=0016"></script>
		<script type="text/javascript" src="game/team.js?v=0016"></script>

		<script type="text/javascript" src="io/io.js?v=0016"></script>
		<script>
			function shouldWaitForLandscape() {
				return window.matchMedia &&
					window.matchMedia("(orientation: portrait) and (pointer: coarse)").matches;
			}

			function startGameWhenLandscape() {
				if (window.game != null) {
					return;
				}

				if (shouldWaitForLandscape()) {
					window.addEventListener("resize", startGameWhenLandscape);
					window.addEventListener("orientationchange", startGameWhenLandscape);
					return;
				}

				window.removeEventListener("resize", startGameWhenLandscape);
				window.removeEventListener("orientationchange", startGameWhenLandscape);
				startLoop();
			}
		</script>
	</head>
	<body onload="startGameWhenLandscape();">
		<div id="rotateNotice">Rotate your phone to landscape</div>
		<img id="pitch" class="hiddenAsset" src="resources/pitch.jpg">
		<img id="ball" class="hiddenAsset" src="resources/ball.png">
		<img id="player-home" class="hiddenAsset" src="resources/player-sprite-home.png">
		<img id="player-away" class="hiddenAsset" src="resources/player-sprite-away.png">
		<canvas id="myCanvas" width="640" height="480"></canvas>
	</body>
</html>
