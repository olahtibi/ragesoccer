		<script>
			function shouldWaitForLandscape() {
				return window.matchMedia &&
					window.matchMedia("(orientation: portrait) and (pointer: coarse)").matches;
			}

			function startGameWhenLandscape() {
				if (window.game != null) {
					return;
				}

				if (shouldWaitForLandscape()) {
					window.addEventListener("resize", startGameWhenLandscape);
					window.addEventListener("orientationchange", startGameWhenLandscape);
					return;
				}

				window.removeEventListener("resize", startGameWhenLandscape);
				window.removeEventListener("orientationchange", startGameWhenLandscape);
				startLoop();
			}
		</script>
	</head>
	<body onload="startGameWhenLandscape();">
		<div id="rotateNotice">Rotate your phone to landscape</div>
		<img id="pitch" class="hiddenAsset" src="assets/images/pitch.jpg">
		<img id="ball" class="hiddenAsset" src="assets/images/ball.png">
		<img id="player-home" class="hiddenAsset" src="assets/images/player-sprite-home.png">
		<img id="player-away" class="hiddenAsset" src="assets/images/player-sprite-away.png">
		<canvas id="myCanvas" width="640" height="480"></canvas>
	</body>
